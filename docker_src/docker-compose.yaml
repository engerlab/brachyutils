services:
  BrachyUtils:
    build:
      context: ../
      dockerfile: docker_src/Dockerfile
      ssh:
        - default
      args:
        - HOST_HOME=${HOST_HOME}
        - UID=${UID}
        - GID=${GID}
    image: brachyutils
    container_name: BrachyUtils
    user: "${UID}:${GID}"
    working_dir: /app
    stdin_open: true # docker run -i
    tty: true # docker run -t
    environment:
      - HOST_HOME=${HOST_HOME}
      - UID=${UID}
      - GID=${GID}
      - DEBIAN_FRONTEND=noninteractive
      - QT_QPA_PLATFORM=offscreen
      - DISPLAY=${DISPLAY} # for access to graphical server
    volumes:
      - ${HOST_HOME}/Software/brachyutils:/app/Software/brachyutils
      - ${HOST_HOME}:/home/ubuntu/YourLocalHome
      - /tmp/.X11-unix:/tmp/.X11-unix # for access to graphical server
    expose:
      - "8000"
    networks:
      net_brachyutils:
        ipv4_address: 192.168.1.10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  Pyplastimatch:
    build:
      context: ../
      dockerfile: docker_src/Dockerfile
    image: pyplastimatch
    container_name: PyPlastimatch
    user: "${UID}:${GID}"
    working_dir: /app
    stdin_open: true # docker run -i
    tty: true # docker run -t
    environment:
      - HOST_HOME=${HOST_HOME}
      - DEBIAN_FRONTEND=noninteractive
      - UID=${UID}
      - GID=${GID}
    volumes:
      - registration-volume:/app/Software/pyplastimatch/temp_data
      # for developement
      - ${HOST_HOME}/Software/pyplastimatch:/app/Software/pyplastimatch
      - ${HOST_HOME}:/app/YourLocalHome
    networks:
      net_brachyutils:
        ipv4_address: 192.168.1.13
    entrypoint: ["/bin/bash"]
    command: ["/app/Software/pyplastimatch/run_api.sh"]

  DoseCalcMC:
    build:
      context: ../
      dockerfile: docker_src/Dockerfile
    image: rapidbrachy_mc
    container_name: DoseCalcMC
    user: "${UID}:${GID}"
    working_dir: /app
    stdin_open: true # docker run -i
    tty: true # docker run -t
    environment:
      - HOST_HOME=${HOST_HOME}
      - DEBIAN_FRONTEND=noninteractive
      - UID=${UID}
      - GID=${GID}
    volumes:
      - ${HOST_HOME}/Software/RapidBrachyMCTPS/RapidBrachyMC_Merge:/app/Software/RapidBrachyMCTPS/RapidBrachyMC_Merge
      - ${HOST_HOME}:/app/YourLocalHome
      - mc-volume:/app/Software/RapidBrachyMCTPS/RapidBrachyMC_Merge/temp_data
    networks:
      net_brachyutils:
        ipv4_address: 192.168.1.11
    entrypoint: ["/bin/bash"]
    command: ["/app/Software/RapidBrachyMCTPS/RapidBrachyMC_Merge/run_api.sh"]

  DoseCalcTG43:
    build:
      context: ../
      dockerfile: docker_src/Dockerfile
    image: rapidbrachy_tg43
    container_name: DoseCalcTG43
    user: "${UID}:${GID}"
    working_dir: /app
    stdin_open: true # docker run -i
    tty: true # docker run -t
    environment:
      - HOST_HOME=${HOST_HOME}
      - DEBIAN_FRONTEND=noninteractive
      - UID=${UID}
      - GID=${GID}
    volumes:
      - ${HOST_HOME}/Software/TG43_Dose_Calculation_Standalone:/app/Software/TG43_Dose_Calculation_Standalone
      - ${HOST_HOME}:/app/YourLocalHome
      - tg43-volume:/app/Software/TG43_Dose_Calculation_Standalone/temp_data
    networks:
      net_brachyutils:
        ipv4_address: 192.168.1.12
    entrypoint: ["/bin/bash"]
    command: ["/app/Software/TG43_Dose_Calculation_Standalone/run_api.sh"]

networks:
  net_brachyutils:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24

# defining a shared volume on hard drive for files
volumes:
  registration-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_HOME}/Software/brachyutils/temp_data/registration

  mc-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_HOME}/Software/brachyutils/temp_data/mc

  tg43-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_HOME}/Software/brachyutils/temp_data/tg43
